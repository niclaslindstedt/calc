name: lighthouse

# §11.3.10 — Lighthouse runs against the built app (the PWA is the
# website), with thresholds enforced via
# .github/lighthouse/lighthouserc.json. Catches the Core Web Vitals
# regressions the static seo workflow can't see.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
  packages: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npm install --global @lhci/cli@0.14.x
      - run: lhci autorun --config=./.github/lighthouse/lighthouserc.json
