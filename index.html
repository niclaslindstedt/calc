<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `viewport-fit=cover` lets the app paint under the notch / home
         indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Calc — a local-first calculator</title>
    <meta
      name="description"
      content="Calc is a local-first calculator PWA with named sessions: every calculation lands on a commentable tape, sessions save as markdown files to a local folder or the cloud, and layouts are yours to customize."
    />
    <link rel="canonical" href="https://calc.niclaslindstedt.se/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calc — a local-first calculator" />
    <meta
      property="og:description"
      content="A calculator PWA with named, commentable sessions stored as markdown — local folder or cloud, basic / scientific / programmer layouts, and custom modes."
    />
    <meta property="og:url" content="https://calc.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://calc.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calc — a local-first calculator" />
    <meta
      name="twitter:description"
      content="A calculator PWA with named, commentable sessions stored as markdown — local folder or cloud, and layouts you can trim to the buttons you use."
    />
    <meta
      name="twitter:image"
      content="https://calc.niclaslindstedt.se/og.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Calc",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "description": "A local-first calculator PWA with named sessions, a commentable tape, markdown storage, and customizable layouts.",
        "url": "https://calc.niclaslindstedt.se/",
        "image": "https://calc.niclaslindstedt.se/og.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
