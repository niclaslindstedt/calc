<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Calc mark: a bold division sign in the family's green gradient on
       the app's dark surface — the single-glyph style of the sibling apps.
       scripts/generate-icons.mjs rasterises the same geometry; keep the two
       in lockstep. -->
  <defs>
    <linearGradient id="g" x1="0" y1="20" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86efac" />
      <stop offset="1" stop-color="#4ade80" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0b0d10" />
  <circle cx="50" cy="28" r="8" fill="url(#g)" />
  <rect x="24" y="43" width="52" height="14" rx="5.5" fill="url(#g)" />
  <circle cx="50" cy="72" r="8" fill="url(#g)" />
</svg>
